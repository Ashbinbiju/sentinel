<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="none">
  <rect width="48" height="40" rx="7" fill="#050d0a"/>

  <!-- Grid lines -->
  <line x1="2" y1="34" x2="46" y2="34" stroke="#1e293b" stroke-width="0.6"/>
  <line x1="2" y1="24" x2="46" y2="24" stroke="#1e293b" stroke-width="0.4" stroke-dasharray="2 3"/>
  <line x1="2" y1="14" x2="46" y2="14" stroke="#1e293b" stroke-width="0.4" stroke-dasharray="2 3"/>

  <!-- Candle 1 — Bear (red) -->
  <line x1="7" y1="20" x2="7" y2="22" stroke="#f87171" stroke-width="1" stroke-linecap="round"/>
  <rect x="4.5" y="22" width="5" height="7" rx="0.7" fill="#f87171" fill-opacity="0.85"/>
  <line x1="7" y1="29" x2="7" y2="32" stroke="#f87171" stroke-width="1" stroke-linecap="round"/>

  <!-- Candle 2 — Bull (green) -->
  <line x1="16" y1="16" x2="16" y2="18" stroke="#34d399" stroke-width="1" stroke-linecap="round"/>
  <rect x="13.5" y="18" width="5" height="9" rx="0.7" fill="#34d399" fill-opacity="0.85"/>
  <line x1="16" y1="27" x2="16" y2="30" stroke="#34d399" stroke-width="1" stroke-linecap="round"/>

  <!-- Candle 3 — Bull (green) -->
  <line x1="25" y1="10" x2="25" y2="13" stroke="#34d399" stroke-width="1" stroke-linecap="round"/>
  <rect x="22.5" y="13" width="5" height="12" rx="0.7" fill="#34d399" fill-opacity="0.9"/>
  <line x1="25" y1="25" x2="25" y2="28" stroke="#34d399" stroke-width="1" stroke-linecap="round"/>

  <!-- Candle 4 — Bull (green), tallest — ENTRY -->
  <line x1="34" y1="5" x2="34" y2="8" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="31.5" y="8" width="5" height="16" rx="0.7" fill="#34d399" fill-opacity="0.95"/>
  <line x1="34" y1="24" x2="34" y2="27" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>

  <!-- EMA curve -->
  <path d="M 7,21 C 10,21 12,17 16,17 C 20,17 22,12 25,11 C 28,10 31,7 34,6"
    stroke="#34d399" stroke-width="1.1" stroke-linecap="round" fill="none"
    stroke-opacity="0.6" stroke-dasharray="2.5 2"/>

  <!-- VWAP line -->
  <path d="M 7,24 C 10,23 13,21 16,20 C 20,19 22,15 25,14 C 29,13 31,10 34,9"
    stroke="#60a5fa" stroke-width="0.9" stroke-linecap="round" fill="none"
    stroke-opacity="0.5" stroke-dasharray="1.5 2.5"/>

  <!-- Signal burst -->
  <circle cx="34" cy="5" r="4" stroke="#34d399" stroke-width="1" fill="#34d399" fill-opacity="0.15" stroke-opacity="0.9"/>
  <circle cx="34" cy="5" r="1.5" fill="#10b981" fill-opacity="1"/>

  <!-- Arrow up -->
  <path d="M 33,2 L 34,0 L 35,2" stroke="#34d399" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.9"/>
</svg>
