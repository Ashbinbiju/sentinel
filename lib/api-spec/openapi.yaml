openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock market data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stocks/market-indices:
    get:
      operationId: getMarketIndices
      tags: [stocks]
      summary: Get broad market indices
      responses:
        "200":
          description: Market indices data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketIndex"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/sectors:
    get:
      operationId: getSectors
      tags: [stocks]
      summary: Get sector performance
      responses:
        "200":
          description: Sector performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorPerformance"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/momentum-picks:
    get:
      operationId: getMomentumPicks
      tags: [stocks]
      summary: Get momentum stock picks with SL/Target
      description: Returns filtered stocks from top 4 sectors with 0.3%–3.0% change, enriched with VWAP/EMA20 signals, SL, targets, and smart exit rules. Also returns top 5 intraday picks.
      responses:
        "200":
          description: Momentum stock picks grouped by sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentumPicksResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/trades/history:
    get:
      operationId: getTradeHistory
      tags: [stocks]
      summary: Get historical trade signals from the database
      description: Returns trade signals from the last N days (default 30, max 90) grouped by date, with estimated P&L per trade based on final status.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 90
          description: Number of past days to fetch
      responses:
        "200":
          description: Trade history grouped by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeHistoryResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketIndex:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
      required:
        - symbol
        - ltp
        - changePct
    SectorPerformance:
      type: object
      properties:
        name:
          type: string
        keyword:
          type: string
        changePct:
          type: number
      required:
        - name
        - keyword
        - changePct
    StockItem:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
        vwap:
          type: ["number", "null"]
        ema20:
          type: ["number", "null"]
        confirmedClose:
          type: ["number", "null"]
        entrySignal:
          type: ["boolean", "null"]
        sl:
          type: ["number", "null"]
          description: Stop loss price (0.4% below VWAP support level)
        target1:
          type: ["number", "null"]
          description: First target price (1:1.5 Risk:Reward)
        target2:
          type: ["number", "null"]
          description: Second target price (1:2.5 Risk:Reward)
        riskPct:
          type: ["number", "null"]
          description: Risk percentage from entry to SL
        smartExit:
          type: ["string", "null"]
          description: Plain-English smart exit rule for this trade
        sparkline:
          type: array
          items:
            type: number
          description: Downsampled intraday close prices (up to 40 pts) for sparkline rendering
        circuitLimit:
          type: ["string", "null"]
          enum: ["upper", "lower", null]
          description: Set to 'upper' or 'lower' if last 3 candles have identical close (frozen price = circuit hit), null otherwise
        volumeRatio:
          type: ["number", "null"]
          description: Last confirmed candle volume divided by session average volume (e.g. 1.8 = 1.8x average)
        volumeOk:
          type: ["boolean", "null"]
          description: True if volumeRatio >= 1.5 (strong volume confirmation), false otherwise
      required:
        - symbol
        - ltp
        - changePct
    TopPick:
      type: object
      description: One of the top 5 intraday picks across all sectors
      properties:
        symbol:
          type: string
        sectorName:
          type: string
        ltp:
          type: number
        changePct:
          type: number
        entry:
          type: number
          description: Confirmed close (entry price)
        sl:
          type: number
          description: Stop loss price
        target1:
          type: number
          description: First target (1:1.5 RR)
        target2:
          type: number
          description: Second target (1:2.5 RR)
        riskPct:
          type: number
          description: Risk % from entry to SL
        smartExit:
          type: string
          description: Smart exit rule
        vwap:
          type: number
        ema20:
          type: number
        sparkline:
          type: array
          items:
            type: number
          description: Downsampled intraday close prices for sparkline rendering
        circuitLimit:
          type: ["string", "null"]
          enum: ["upper", "lower", null]
          description: Set to 'upper' or 'lower' if last 3 candles have identical close (frozen price = circuit hit), null otherwise
        volumeRatio:
          type: ["number", "null"]
          description: Last confirmed candle volume divided by session average volume
        volumeOk:
          type: ["boolean", "null"]
          description: True if volumeRatio >= 1.5 (strong volume confirmation)
      required:
        - symbol
        - sectorName
        - ltp
        - changePct
        - entry
        - sl
        - target1
        - target2
        - riskPct
        - smartExit
        - vwap
        - ema20
    SectorWithStocks:
      type: object
      properties:
        sectorName:
          type: string
        sectorKeyword:
          type: string
        sectorChangePct:
          type: number
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/StockItem"
      required:
        - sectorName
        - sectorKeyword
        - sectorChangePct
        - stocks
    MomentumPicksResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          description: ISO timestamp (UTC) of when data was fetched
        indicatorDate:
          type: ["string", "null"]
          description: IST date of the trading session used for indicators (YYYY-MM-DD)
        isLiveSession:
          type: boolean
          description: True if indicator data is from today's live session in IST
        lastCandleTimeIST:
          type: ["string", "null"]
          description: IST time (HH:MM) of the last confirmed candle used for signals
        topPicks:
          type: array
          description: Top 5 intraday picks across all sectors (entry signal stocks sorted by momentum score)
          items:
            $ref: "#/components/schemas/TopPick"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorWithStocks"
      required:
        - fetchedAt
        - isLiveSession
        - topPicks
        - sectors
    HistoryTrade:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          description: YYYY-MM-DD (IST)
        signalTime:
          type: string
          description: UTC ISO timestamp of when the signal fired
        entryPrice:
          type: string
        sl:
          type: string
        target1:
          type: string
        target2:
          type: string
        status:
          type: string
          description: Final trade status (TARGET 2 HIT, TARGET 1 HIT, SL HIT, T1 HIT & TRAILING SL HIT, SQUARED OFF, ACTIVE, PENDING)
        plPct:
          type: ["number", "null"]
          description: Estimated P&L % based on final status. Null for ACTIVE/PENDING/SQUARED OFF trades.
      required:
        - id
        - symbol
        - date
        - signalTime
        - entryPrice
        - sl
        - target1
        - target2
        - status
    TradeHistoryDaySummary:
      type: object
      properties:
        total:
          type: integer
        winners:
          type: integer
        losers:
          type: integer
        breakeven:
          type: integer
        pending:
          type: integer
      required: [total, winners, losers, breakeven, pending]
    TradeHistoryDay:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        trades:
          type: array
          items:
            $ref: "#/components/schemas/HistoryTrade"
        summary:
          $ref: "#/components/schemas/TradeHistoryDaySummary"
      required: [date, trades, summary]
    TradeHistoryResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/TradeHistoryDay"
      required: [days]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
