openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock market data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stocks/market-indices:
    get:
      operationId: getMarketIndices
      tags: [stocks]
      summary: Get broad market indices
      description: Fetches real-time performance of major market indices (NIFTY 50, BANKNIFTY etc.)
      responses:
        "200":
          description: Market indices data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketIndex"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/sectors:
    get:
      operationId: getSectors
      tags: [stocks]
      summary: Get sector performance
      description: Retrieves daily percentage change for all major NSE sectors
      responses:
        "200":
          description: Sector performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorPerformance"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/momentum-picks:
    get:
      operationId: getMomentumPicks
      tags: [stocks]
      summary: Get momentum stock picks
      description: Returns filtered stocks from top 4 sectors with 0.3% to 3.0% change, enriched with VWAP and EMA20 signals from 5-minute candles
      responses:
        "200":
          description: Momentum stock picks grouped by sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentumPicksResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketIndex:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
      required:
        - symbol
        - ltp
        - changePct
    SectorPerformance:
      type: object
      properties:
        name:
          type: string
        keyword:
          type: string
        changePct:
          type: number
      required:
        - name
        - keyword
        - changePct
    StockItem:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
        vwap:
          type: ["number", "null"]
        ema20:
          type: ["number", "null"]
        confirmedClose:
          type: ["number", "null"]
        entrySignal:
          type: ["boolean", "null"]
      required:
        - symbol
        - ltp
        - changePct
    SectorWithStocks:
      type: object
      properties:
        sectorName:
          type: string
        sectorKeyword:
          type: string
        sectorChangePct:
          type: number
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/StockItem"
      required:
        - sectorName
        - sectorKeyword
        - sectorChangePct
        - stocks
    MomentumPicksResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          description: ISO timestamp (UTC) of when data was fetched
        indicatorDate:
          type: ["string", "null"]
          description: IST date of the trading session used for indicators (YYYY-MM-DD)
        isLiveSession:
          type: boolean
          description: True if indicator data is from today's live session in IST
        lastCandleTimeIST:
          type: ["string", "null"]
          description: IST time (HH:MM) of the last confirmed candle used for signals
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorWithStocks"
      required:
        - fetchedAt
        - isLiveSession
        - sectors
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
