openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock market data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stocks/market-indices:
    get:
      operationId: getMarketIndices
      tags: [stocks]
      summary: Get broad market indices
      responses:
        "200":
          description: Market indices data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketIndex"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/sectors:
    get:
      operationId: getSectors
      tags: [stocks]
      summary: Get sector performance
      responses:
        "200":
          description: Sector performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorPerformance"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/momentum-picks:
    get:
      operationId: getMomentumPicks
      tags: [stocks]
      summary: Get ChartPrime Power Channel stock picks with SL/Target
      description: Returns filtered stocks from the most active sectors, enriched with ChartPrime Power Channel zone reaction signals, direction, SL, targets, reward:risk, and smart exit rules. Entry candidates must trade at or above INR 100 and avoid repeated zone-tap consolidation. Also returns top 5 intraday picks.
      responses:
        "200":
          description: Power Channel stock picks grouped by sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentumPicksResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/trades/today:
    get:
      operationId: getTodayTrades
      tags: [stocks]
      summary: Get today's intraday trade signals
      description: Returns current-strategy intraday signals recorded for today's IST session, enriched with live outcome status, inferred direction, and optional hit time.
      responses:
        "200":
          description: Today's trade signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayTradesResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/trades/history:
    get:
      operationId: getTradeHistory
      tags: [stocks]
      summary: Get historical trade signals from the database
      description: Returns current-strategy trade signals from the last N days (default 30, max 90) grouped by date, with estimated P&L per trade based on final status. Legacy rows saved before the active Power Channel rules are filtered out.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 90
          description: Number of past days to fetch
      responses:
        "200":
          description: Trade history grouped by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeHistoryResponse"
        "500":
          description: Failed to fetch data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/swing-scanner:
    get:
      operationId: getSwingScanner
      tags: [stocks]
      summary: Start a swing scanner job
      description: Starts or returns the active background swing scan. Symbols already in an open swing trade (WATCHLIST, ACTIVE, EXIT REVIEW) are excluded from new picks.
      parameters:
        - in: query
          name: sectors
          schema:
            type: string
          description: Optional comma-separated sector names. Omit to scan all sectors.
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 10
          description: Maximum number of swing picks to save and return.
      responses:
        "200":
          description: Swing scan job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwingScanJobResponse"
        "500":
          description: Failed to start scanner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/swing-scanner/jobs/{jobId}:
    get:
      operationId: getSwingScanJob
      tags: [stocks]
      summary: Get swing scanner job progress
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Job id returned by /stocks/swing-scanner.
      responses:
        "200":
          description: Swing scan job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwingScanJobResponse"
        "404":
          description: Job expired or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stocks/swing-sectors:
    get:
      operationId: getSwingSectors
      tags: [stocks]
      summary: Get swing scanner sector universe
      responses:
        "200":
          description: Swing sector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwingSectorsResponse"
  /stocks/swing-trades:
    get:
      operationId: getSwingTrades
      tags: [stocks]
      summary: Get swing trade tracker entries
      description: Returns saved swing entries and tracker status. Open entries are de-duplicated so only one WATCHLIST/ACTIVE/EXIT REVIEW row per symbol is returned.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 45
            minimum: 1
            maximum: 180
          description: Number of past calendar days to fetch.
        - in: query
          name: status
          schema:
            type: string
            default: all
          description: Optional status filter, e.g. WATCHLIST, ACTIVE, TARGET HIT, SL HIT, EXIT REVIEW, or all.
      responses:
        "200":
          description: Swing tracker response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwingTrackerResponse"
        "500":
          description: Failed to fetch swing trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketIndex:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
      required:
        - symbol
        - ltp
        - changePct
    SectorPerformance:
      type: object
      properties:
        name:
          type: string
        keyword:
          type: string
        changePct:
          type: number
      required:
        - name
        - keyword
        - changePct
    ScannerWarning:
      type: object
      properties:
        symbol:
          type: ["string", "null"]
        sectorName:
          type: ["string", "null"]
        code:
          type: string
          enum:
            - NO_CANDLE_DATA
            - NO_CONFIRMED_CANDLES
            - DB_PERSIST_FAILED
            - INDICATOR_ENRICH_FAILED
            - SECTOR_SCAN_FAILED
        message:
          type: string
      required:
        - symbol
        - sectorName
        - code
        - message
    StockItem:
      type: object
      properties:
        symbol:
          type: string
        ltp:
          type: number
        changePct:
          type: number
        vwap:
          type: ["number", "null"]
        ema20:
          type: ["number", "null"]
        confirmedClose:
          type: ["number", "null"]
        entrySignal:
          type: ["boolean", "null"]
        direction:
          type: ["string", "null"]
          enum: ["LONG", "SHORT", null]
          description: Trade direction from the Power Channel setup
        setup:
          type: ["string", "null"]
          description: Power Channel setup name, such as support reaction or resistance rejection
        sl:
          type: ["number", "null"]
          description: Stop loss price outside the active ChartPrime support/resistance zone
        target1:
          type: ["number", "null"]
          description: First scale target, one risk unit from entry
        target2:
          type: ["number", "null"]
          description: Final target at the opposite ChartPrime support/resistance zone
        riskPct:
          type: ["number", "null"]
          description: Risk percentage from entry to SL
        rewardRisk:
          type: ["number", "null"]
          description: Reward-to-risk ratio for the final Power Channel target
        smartExit:
          type: ["string", "null"]
          description: Plain-English smart exit rule for this trade
        sparkline:
          type: array
          items:
            type: number
          description: Downsampled intraday close prices (up to 40 pts) for sparkline rendering
        circuitLimit:
          type: ["string", "null"]
          enum: ["upper", "lower", null]
          description: Set to 'upper' or 'lower' if last 3 candles have identical close (frozen price = circuit hit), null otherwise
        volumeRatio:
          type: ["number", "null"]
          description: Last confirmed candle volume divided by the recent 20-candle average volume (e.g. 1.8 = 1.8x average)
        volumeOk:
          type: ["boolean", "null"]
          description: True if volumeRatio is at least 1.15; volume is context only for Power Channel signals
        signalTime:
          type: ["string", "null"]
          description: UTC ISO timestamp of when the signal fired
        marketAlignment:
          type: string
          enum: ["ALIGNED", "CAUTION", "BLOCKED", "UNKNOWN"]
          description: Index trend alignment for the signal direction
        marketAlignmentText:
          type: ["string", "null"]
          description: NIFTY/BANKNIFTY 15m and 1h trend context
        marketTrendScoreAdjustment:
          type: number
          description: Score adjustment from index trend alignment
        marketTrendIndex:
          type: ["string", "null"]
          enum: ["NIFTY", "BANKNIFTY", null]
          description: Index used for market alignment
        warning:
          oneOf:
            - $ref: "#/components/schemas/ScannerWarning"
            - type: "null"
          description: Warning explaining why scanner data for this symbol is incomplete, if any
      required:
        - symbol
        - ltp
        - changePct
    TopPick:
      type: object
      description: One of the top 5 intraday picks across all sectors. Picks below INR 100 are excluded.
      properties:
        symbol:
          type: string
        sectorName:
          type: string
        ltp:
          type: number
        changePct:
          type: number
        entry:
          type: number
          description: Confirmed close (entry price)
        sl:
          type: number
          description: Stop loss price
        target1:
          type: number
          description: First scale target, one risk unit from entry
        target2:
          type: number
          description: Final target at the opposite ChartPrime support/resistance zone
        riskPct:
          type: number
          description: Risk % from entry to SL
        rewardRisk:
          type: number
          description: Reward-to-risk ratio for the final Power Channel target
        direction:
          type: string
          enum: ["LONG", "SHORT"]
          description: Trade direction from the Power Channel setup
        setup:
          type: string
          description: Power Channel setup name
        smartExit:
          type: string
          description: Smart exit rule
        vwap:
          type: number
        ema20:
          type: number
        sparkline:
          type: array
          items:
            type: number
          description: Downsampled intraday close prices for sparkline rendering
        circuitLimit:
          type: ["string", "null"]
          enum: ["upper", "lower", null]
          description: Set to 'upper' or 'lower' if last 3 candles have identical close (frozen price = circuit hit), null otherwise
        volumeRatio:
          type: ["number", "null"]
          description: Last confirmed candle volume divided by the recent 20-candle average volume
        volumeOk:
          type: ["boolean", "null"]
          description: True if volumeRatio is at least 1.15; volume is context only for Power Channel signals
        signalTime:
          type: ["string", "null"]
          description: UTC ISO timestamp of when the signal fired
        marketAlignment:
          type: string
          enum: ["ALIGNED", "CAUTION", "BLOCKED", "UNKNOWN"]
          description: Index trend alignment for the signal direction
        marketAlignmentText:
          type: ["string", "null"]
          description: NIFTY/BANKNIFTY 15m and 1h trend context
        marketTrendScoreAdjustment:
          type: number
          description: Score adjustment from index trend alignment
        marketTrendIndex:
          type: ["string", "null"]
          enum: ["NIFTY", "BANKNIFTY", null]
          description: Index used for market alignment
      required:
        - symbol
        - sectorName
        - ltp
        - changePct
        - entry
        - sl
        - target1
        - target2
        - riskPct
        - rewardRisk
        - direction
        - setup
        - smartExit
        - vwap
        - ema20
    SectorWithStocks:
      type: object
      properties:
        sectorName:
          type: string
        sectorKeyword:
          type: string
        sectorChangePct:
          type: number
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/StockItem"
        warning:
          oneOf:
            - $ref: "#/components/schemas/ScannerWarning"
            - type: "null"
          description: Sector-level warning if the sector scan failed
      required:
        - sectorName
        - sectorKeyword
        - sectorChangePct
        - stocks
    MomentumPicksResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          description: ISO timestamp (UTC) of when data was fetched
        indicatorDate:
          type: ["string", "null"]
          description: IST date of the trading session used for indicators (YYYY-MM-DD)
        isLiveSession:
          type: boolean
          description: True if indicator data is from today's live session in IST
        lastCandleTimeIST:
          type: ["string", "null"]
          description: IST time (HH:MM) of the last confirmed candle used for signals
        topPicks:
          type: array
          description: Top 5 intraday picks across all sectors (entry signal stocks sorted by Power Channel setup score)
          items:
            $ref: "#/components/schemas/TopPick"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorWithStocks"
        warnings:
          type: array
          description: Non-fatal scanner warnings. If topPicks is empty, clients can inspect this to distinguish no setup from data/feed/DB issues.
          items:
            $ref: "#/components/schemas/ScannerWarning"
      required:
        - fetchedAt
        - isLiveSession
        - topPicks
        - sectors
    TradeStatus:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - TARGET 1 HIT
        - TARGET 2 HIT
        - SL HIT
        - T1 HIT & TRAILING SL HIT
        - ENTRY INVALID
        - VWAP EXIT
        - SQUARED OFF
    TodayTrade:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          description: YYYY-MM-DD (IST)
        signalTime:
          type: string
          description: UTC ISO timestamp of when the signal fired
        entryPrice:
          type: string
        sl:
          type: string
        target1:
          type: string
        target2:
          type: string
        status:
          $ref: "#/components/schemas/TradeStatus"
        direction:
          type: ["string", "null"]
          enum: ["LONG", "SHORT", null]
          description: Present when the API could infer trade direction from entry/SL/target
        hitTime:
          type: ["string", "null"]
          description: IST HH:MM candle close time for the candle where the status was reached. Exact tick time is not available from OHLC candles.
      required:
        - id
        - symbol
        - date
        - signalTime
        - entryPrice
        - sl
        - target1
        - target2
        - status
    TodayTradesResponse:
      type: object
      properties:
        date:
          type: string
          description: Today's IST date (YYYY-MM-DD)
        trades:
          type: array
          items:
            $ref: "#/components/schemas/TodayTrade"
      required:
        - date
        - trades
    SwingTradeStatus:
      type: string
      enum:
        - WATCHLIST
        - ACTIVE
        - TARGET HIT
        - SL HIT
        - EXIT REVIEW
        - CLOSED
    SwingEntryType:
      type: string
      enum:
        - BREAKOUT
        - PULLBACK
    SwingSectorOption:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
        - name
        - count
    SwingSectorsResponse:
      type: object
      properties:
        totalSectors:
          type: integer
        totalSymbols:
          type: integer
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SwingSectorOption"
      required:
        - totalSectors
        - totalSymbols
        - sectors
    SwingPick:
      type: object
      properties:
        symbol:
          type: string
        sector:
          type: string
        tradeDate:
          type: string
          description: Latest daily candle date used for this setup (YYYY-MM-DD IST)
        signalTime:
          type: string
          description: UTC ISO timestamp of when the scan saved the signal
        currentPrice:
          type: number
          description: Last available daily close at scan time
        entryPrice:
          type: number
          description: Entry trigger price. For many picks this can be above CMP and should be treated as watchlist until touched.
        sl:
          type: number
        target:
          type: number
        score:
          type: number
        signalScore:
          type: number
        grade:
          type: string
        setup:
          type: string
        entryType:
          $ref: "#/components/schemas/SwingEntryType"
        reason:
          type: string
        expectedHoldDays:
          type: number
        recentReturn:
          type: number
        relativeStrength:
          type: number
        sectorRelativeStrength:
          type: number
        rvol:
          type: number
        avgTurnover:
          type: number
        entryDistancePct:
          type: number
        rewardRisk:
          type: number
        breakoutQuality:
          type: string
        trendPersistence:
          type: number
        freshBreakoutAge:
          type: ["number", "null"]
        consolidationCandles:
          type: number
        setupType:
          type: string
          enum:
            - fresh_breakout
            - sector_leader_continuation
            - mean_reversion_bounce
            - high_rvol_explosive
            - slow_institutional_trend
            - trend_continuation
        latestMovePct:
          type: number
        ema20DistancePct:
          type: number
        liquidityScore:
          type: number
        intradaySignal:
          type: string
        swingSignal:
          type: string
        shortTermSignal:
          type: string
        longTermSignal:
          type: string
        breakoutSignal:
          type: string
        ichimokuTrend:
          type: string
        marketRegime:
          type: string
          enum: ["Bull", "Neutral", "Weak", "Unknown"]
        marketBreadthPct:
          type: ["number", "null"]
        industryAdvanceRatio:
          type: ["number", "null"]
        industryBreadthText:
          type: ["string", "null"]
        weakMarketSignalDowngrade:
          type: boolean
        indexTrendIndex:
          type: ["string", "null"]
        indexTrendDirection:
          type: string
          enum: ["Bullish", "Bearish", "Neutral", "Unknown"]
        indexTrendText:
          type: ["string", "null"]
        indexTrendScoreAdjustment:
          type: number
        technicalStage:
          type: ["string", "null"]
        technicalScoreAdjustment:
          type: number
        technicalIndicatorText:
          type: ["string", "null"]
        technicalRs55:
          type: ["number", "null"]
        technicalVolumeRatio:
          type: ["number", "null"]
        technicalAboveEma200:
          type: ["boolean", "null"]
        technicalMacdTrend:
          type: string
          enum: ["Bullish", "Bearish", "Neutral", "Unknown"]
        technicalAdxTrend:
          type: string
          enum: ["Bullish", "Bearish", "Neutral", "Unknown"]
        insiderActivity:
          type: string
          enum: ["Buy", "Sell", "Mixed", "None"]
        insiderScoreAdjustment:
          type: number
        insiderActivityText:
          type: ["string", "null"]
        insiderTransactionValue:
          type: ["number", "null"]
        insiderTransactionDate:
          type: ["string", "null"]
        insiderCategory:
          type: ["string", "null"]
      required:
        - symbol
        - sector
        - tradeDate
        - signalTime
        - currentPrice
        - entryPrice
        - sl
        - target
        - score
        - signalScore
        - grade
        - setup
        - entryType
        - reason
        - expectedHoldDays
        - recentReturn
        - relativeStrength
        - sectorRelativeStrength
        - rvol
        - avgTurnover
        - entryDistancePct
        - rewardRisk
        - breakoutQuality
        - trendPersistence
        - freshBreakoutAge
        - consolidationCandles
        - setupType
        - latestMovePct
        - ema20DistancePct
        - liquidityScore
        - intradaySignal
        - swingSignal
        - shortTermSignal
        - longTermSignal
        - breakoutSignal
        - ichimokuTrend
        - marketRegime
        - marketBreadthPct
        - industryAdvanceRatio
        - industryBreadthText
        - weakMarketSignalDowngrade
        - indexTrendIndex
        - indexTrendDirection
        - indexTrendText
        - indexTrendScoreAdjustment
        - technicalStage
        - technicalScoreAdjustment
        - technicalIndicatorText
        - technicalRs55
        - technicalVolumeRatio
        - technicalAboveEma200
        - technicalMacdTrend
        - technicalAdxTrend
        - insiderActivity
        - insiderScoreAdjustment
        - insiderActivityText
        - insiderTransactionValue
        - insiderTransactionDate
        - insiderCategory
    SwingScannerResult:
      type: object
      properties:
        fetchedAt:
          type: string
        date:
          type: string
          description: Trading date represented by the scan result (YYYY-MM-DD IST)
        selectedSectors:
          type: array
          items:
            type: string
        sectorCount:
          type: integer
        universeCount:
          type: integer
        candidateCount:
          type: integer
        savedCount:
          type: integer
        niftyReturn:
          type: number
        marketRegime:
          type: string
          enum: ["Bull", "Neutral", "Weak", "Unknown"]
        marketBreadthPct:
          type: ["number", "null"]
        picks:
          type: array
          items:
            $ref: "#/components/schemas/SwingPick"
      required:
        - fetchedAt
        - date
        - selectedSectors
        - sectorCount
        - universeCount
        - candidateCount
        - savedCount
        - niftyReturn
        - marketRegime
        - marketBreadthPct
        - picks
    SwingScanJobResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        selectedSectors:
          type: array
          items:
            type: string
        sectorCount:
          type: integer
        universeCount:
          type: integer
        processedCount:
          type: integer
        candidateCount:
          type: integer
        savedCount:
          type: integer
        progressPct:
          type: number
        message:
          type: string
        error:
          type: ["string", "null"]
        result:
          oneOf:
            - $ref: "#/components/schemas/SwingScannerResult"
            - type: "null"
      required:
        - jobId
        - status
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
        - selectedSectors
        - sectorCount
        - universeCount
        - processedCount
        - candidateCount
        - savedCount
        - progressPct
        - message
        - error
        - result
    SwingTrackerSummary:
      type: object
      properties:
        total:
          type: integer
        watchlist:
          type: integer
        active:
          type: integer
        targetHit:
          type: integer
        slHit:
          type: integer
        exitReview:
          type: integer
        open:
          type: integer
      required:
        - total
        - watchlist
        - active
        - targetHit
        - slHit
        - exitReview
        - open
    SwingTrackerTrade:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          description: Scan/trade date (YYYY-MM-DD IST)
        signalTime:
          type: string
        sector:
          type: ["string", "null"]
        direction:
          type: string
          enum: ["LONG", "SHORT"]
        entryType:
          $ref: "#/components/schemas/SwingEntryType"
        currentPrice:
          type: string
        entryPrice:
          type: string
        sl:
          type: string
        target:
          type: string
        score:
          type: string
        grade:
          type: string
        setup:
          type: string
        reason:
          type: ["string", "null"]
        expectedHoldDays:
          type: string
        status:
          $ref: "#/components/schemas/SwingTradeStatus"
        entryHitDate:
          type: ["string", "null"]
        exitDate:
          type: ["string", "null"]
        lastPrice:
          type: ["string", "null"]
        lastCheckedAt:
