    SwingTrackerResponse:
      type: object
      properties:
        fetchedAt:
          type: string
        days:
          type: integer
        summary:
          $ref: "#/components/schemas/SwingTrackerSummary"
        trades:
          type: array
          items:
            $ref: "#/components/schemas/SwingTrackerTrade"
      required:
        - fetchedAt
        - days
        - summary
        - trades
    HistoryTrade:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          description: YYYY-MM-DD (IST)
        signalTime:
          type: string
          description: UTC ISO timestamp of when the signal fired
        entryPrice:
          type: string
        sl:
          type: string
        target1:
          type: string
        target2:
          type: string
        direction:
          type: string
          enum: ["LONG", "SHORT"]
          description: Inferred trade direction based on entry, SL, and target
        status:
          type: string
          description: Final trade status (TARGET 2 HIT, TARGET 1 HIT, SL HIT, T1 HIT & TRAILING SL HIT, SQUARED OFF, ACTIVE, PENDING)
        hitTime:
          type: ["string", "null"]
          description: IST HH:MM candle close time for the candle where the status was reached. Exact tick time is not available from OHLC candles.
        plPct:
          type: ["number", "null"]
          description: Estimated P&L % based on final status. T1 trailing outcomes assume 50% booked at target1 and 50% exited at the trailing stop, target2, or square-off price. SQUARED OFF uses the latest available candle closing at or before 15:15 IST. Null for ACTIVE/PENDING trades or when exit data is unavailable.
      required:
        - id
        - symbol
        - date
        - signalTime
        - entryPrice
        - sl
        - target1
        - target2
        - direction
        - status
    TradeHistoryDaySummary:
      type: object
      properties:
        total:
          type: integer
        winners:
          type: integer
        losers:
          type: integer
        breakeven:
          type: integer
        pending:
          type: integer
      required: [total, winners, losers, breakeven, pending]
    TradeHistoryDay:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        trades:
          type: array
          items:
            $ref: "#/components/schemas/HistoryTrade"
        summary:
          $ref: "#/components/schemas/TradeHistoryDaySummary"
      required: [date, trades, summary]
    TradeHistoryResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/TradeHistoryDay"
      required: [days]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
