services:
  - type: web
    name: sentinel-api
    env: node
    region: singapore # closest to India
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in Render dashboard
      - key: ANGEL_API_KEY
        sync: false # set manually in Render dashboard
      - key: ANGEL_CLIENT_CODE
        sync: false # set manually in Render dashboard
      - key: ANGEL_PASSWORD
        sync: false # set manually in Render dashboard
      - key: ANGEL_TOTP_SECRET
        sync: false # set manually in Render dashboard
      - key: ANGEL_MARKET_DATA_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false # set manually in Render dashboard
      - key: TELEGRAM_CHAT_ID
        sync: false # set manually in Render dashboard

  # ── Keep-alive cron job ───────────────────────────────────────────────────────
  # Render free-tier web services spin down after ~15 min of no traffic.
  # The dashboard keep-alive ping only works while a browser tab is open.
  # This cron job pings /api/healthz every 4 minutes unconditionally so the
  # API stays warm regardless of whether anyone has the dashboard open.
  #
  # Actual Render URL for this deployment (visible in the Render dashboard).
  - type: cron
    name: sentinel-keepalive
    env: node
    region: singapore
    plan: free
    schedule: "*/4 * * * *" # every 4 minutes, all day
    buildCommand: "echo 'no build needed'"
    startCommand: >
      node -e "
        const url = 'https://sentinel-sbkm.onrender.com/api/healthz';
        fetch(url)
          .then(r => console.log('[keepalive] ping ok -', r.status, url))
          .catch(e => { console.error('[keepalive] ping failed:', e.message); process.exit(1); });
      "
